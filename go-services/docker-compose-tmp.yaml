services:
    mysql-users:
        image: mysql:8.0
        container_name: mysql-users
        restart: "no"
        stop_grace_period: 30s
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: user_db
            MYSQL_USER: user
            MYSQL_PASSWORD: password
        ports:
            - "3307:3306"
        volumes:
            - ./user_service/db.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 20
    mysql-products:
        image: mysql:8.0
        container_name: mysql-products
        restart: "no"
        stop_grace_period: 30s
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: product_db
            MYSQL_USER: user
            MYSQL_PASSWORD: password
        ports:
            - "3308:3306"
        volumes:
            - ./product_service/db.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 20
    mysql-orders:
        image: mysql:8.0
        container_name: mysql-orders
        restart: "no"
        stop_grace_period: 30s
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: order_db
            MYSQL_USER: user
            MYSQL_PASSWORD: password
        ports:
            - "3309:3306"
        volumes:
            - ./order_service/db.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 20
    zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        container_name: zookeeper
        restart: "no"
        stop_grace_period: 20s
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        ports:
            - "2181:2181"
        healthcheck:
            test: ["CMD", "nc", "-z", "localhost", "2181"]
            interval: 5s
            timeout: 5s
            retries: 10
    kafka:
        image: confluentinc/cp-kafka:7.5.0
        container_name: kafka
        restart: "no"
        stop_grace_period: 20s
        depends_on:
            zookeeper:
                condition: service_healthy
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
            - "29092:29092"
        healthcheck:
            test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
            interval: 10s
            timeout: 10s
            retries: 10
    kafka-init:
        image: confluentinc/cp-kafka:7.5.0
        container_name: kafka-init
        depends_on:
            kafka:
                condition: service_healthy
        entrypoint: ['/bin/bash', '-c']
        command: |
            "
            echo 'Creating Kafka topics...'
            kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic order-events --partitions 3 --replication-factor 1
            echo 'Topics created successfully!'
            kafka-topics --bootstrap-server kafka:9092 --list
            tail -f /dev/null
            "
        restart: "no"
        healthcheck:
            test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
            interval: 5s
            timeout: 10s
            retries: 5
    user_service:
        build:
            context: .
            dockerfile: ./user_service/Dockerfile
        container_name: user_service
        restart: "no"
        stop_grace_period: 20s
        environment:
            DB_HOST: mysql-users
            DB_USER: user
            DB_PASSWORD: password
            DB_NAME: user_db
            FLASK_RUN_PORT: "8082"
            ADMIN_USERNAME: admin
            ADMIN_EMAIL: admin@example.com
            ADMIN_PASSWORD: admin123
            RESET_ADMIN_PASSWORD: "true"
            COVERAGE: "1"
            JWT_TTL_SECONDS: "259200" # 3 days (72 hours) for Keploy testing
        depends_on:
            mysql-users:
                condition: service_healthy
        ports:
            - "8082:8082"
        volumes:
            - ./coverage:/coverage
            - ./user_service/coverage:/svc_coverage
    product_service:
        build:
            context: .
            dockerfile: ./product_service/Dockerfile
        container_name: product_service
        restart: "no"
        stop_grace_period: 20s
        environment:
            DB_HOST: mysql-products
            DB_USER: user
            DB_PASSWORD: password
            DB_NAME: product_db
            FLASK_RUN_PORT: "8081"
            COVERAGE: "1"
        depends_on:
            mysql-products:
                condition: service_healthy
        ports:
            - "8081:8081"
        volumes:
            - ./coverage:/coverage
            - ./product_service/coverage:/svc_coverage
    order_service:
        build:
            context: .
            dockerfile: ./order_service/Dockerfile
        container_name: order_service
        restart: "no"
        stop_grace_period: 20s
        environment:
            DB_HOST: mysql-orders
            DB_USER: user
            DB_PASSWORD: password
            DB_NAME: order_db
            USER_SERVICE_URL: http://user_service:8082/api/v1
            PRODUCT_SERVICE_URL: http://product_service:8081/api/v1
            # Kafka configuration
            KAFKA_BROKERS: kafka:9092
            KAFKA_TOPIC: order-events
            KAFKA_GROUP_ID: order-service-group
            FLASK_RUN_PORT: "8080"
            COVERAGE: "1"
            GOCOVERDIR: /svc_coverage
            NODE_EXTRA_CA_CERTS: /tmp/keploy-tls/ca.crt
            REQUESTS_CA_BUNDLE: /tmp/keploy-tls/ca.crt
            SSL_CERT_FILE: /tmp/keploy-tls/ca.crt
            CARGO_HTTP_CAINFO: /tmp/keploy-tls/ca.crt
            JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/tmp/keploy-tls/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit
        depends_on:
            keploy-agent:
                condition: service_healthy
            mysql-orders:
                condition: service_healthy
            user_service:
                condition: service_started
            product_service:
                condition: service_started
            kafka-init:
                condition: service_healthy
        volumes:
            - ./coverage:/coverage
            - ./order_service/coverage:/svc_coverage
            - keploy-tls-certs:/tmp/keploy-tls:ro
        pid: service:keploy-agent
        network_mode: service:keploy-agent
    apigateway:
        build:
            context: .
            dockerfile: ./apigateway/Dockerfile
        container_name: apigateway
        restart: "no"
        stop_grace_period: 20s
        environment:
            USER_SERVICE_URL: http://user_service:8082/api/v1
            PRODUCT_SERVICE_URL: http://product_service:8081/api/v1
            ORDER_SERVICE_URL: http://order_service:8080/api/v1
            FLASK_RUN_PORT: "8083"
            COVERAGE: "1"
        depends_on:
            user_service:
                condition: service_started
            product_service:
                condition: service_started
            order_service:
                condition: service_started
        ports:
            - "8083:8083"
        volumes:
            - ./coverage:/coverage
            - ./apigateway/coverage:/svc_coverage
    keploy-agent:
        image: docker.io/keploy/enterprise:v3-dev
        container_name: keploy-v3-090f
        # These capabilities are scoped to the container's own isolated network namespace
        # and do NOT grant access to the host's network, interfaces, or firewall.
        # The container runs in its own network namespace — no host access is possible.
        cap_add:
            - BPF
            - PERFMON
            - NET_ADMIN # required for network traffic capture (scoped to container's own namespace)
            - SYS_RESOURCE
            - SYS_PTRACE
        environment:
            - BINARY_TO_DOCKER=true
            - CERT_EXPORT_PATH=/tmp/keploy-tls
        ports:
            - "43951:43951"
            - "16789:16789"
            - "8080:8080"
        networks:
            default:
                aliases:
                    - order_service
        volumes:
            - /sys/fs/cgroup:/sys/fs/cgroup
            - /sys/kernel/debug:/sys/kernel/debug
            - /sys/fs/bpf:/sys/fs/bpf
            - keploy-tls-certs:/tmp/keploy-tls
        command:
            - --port
            - "43951"
            - --proxy-port
            - "16789"
            - --dns-port
            - "26789"
            - --client-pid
            - "701430"
            - --mode
            - test
            - --is-docker
            - --enable-testing
            - --config-path
            - /home/yogesh/projects3/ecommerce_sample_app/go-services
            - --build-delay
            - "90"
        healthcheck:
            test:
                - CMD-SHELL
                - cat /tmp/agent.ready
            interval: 5s
            timeout: 5s
            retries: 60
            start_period: 10s
volumes:
    keploy-tls-certs: {}
