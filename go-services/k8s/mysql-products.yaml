apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-products-init
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS product_db;
    USE product_db;

    CREATE TABLE IF NOT EXISTS products (
        id VARCHAR(36) PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        description TEXT,
        price DECIMAL(10, 2) NOT NULL,
        stock INT NOT NULL,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        INDEX idx_products_name (name),
        CONSTRAINT chk_price_nonneg CHECK (price >= 0),
        CONSTRAINT chk_stock_nonneg CHECK (stock >= 0)
    );

    INSERT INTO products (id, name, description, price, stock) VALUES
    (UUID(), 'Laptop', 'A powerful and portable laptop.', 1200.00, 50),
    (UUID(), 'Mouse', 'An ergonomic wireless mouse.', 25.50, 200);
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-products
spec:
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: mysql-products
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-products
spec:
  selector:
    matchLabels:
      app: mysql-products
  template:
    metadata:
      labels:
        app: mysql-products
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        volumeMounts:
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "root"
        - name: MYSQL_DATABASE
          value: "product_db"
        - name: MYSQL_USER
          value: "user"
        - name: MYSQL_PASSWORD
          value: "password"
        ports:
        - containerPort: 3306
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-u", "root", "-proot"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-u", "root", "-proot"]
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
      volumes:
      - name: init-script
        configMap:
          name: mysql-products-init
