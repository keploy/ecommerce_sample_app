apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-orders-init
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS order_db;
    USE order_db;

    CREATE TABLE IF NOT EXISTS orders (
        id VARCHAR(36) PRIMARY KEY,
        user_id VARCHAR(36) NOT NULL,
        status ENUM('PENDING','PAID','CANCELLED') NOT NULL DEFAULT 'PENDING',
        idempotency_key VARCHAR(64) NULL,
        shipping_address_id VARCHAR(36) NULL,
        total_amount DECIMAL(12, 2) NOT NULL DEFAULT 0,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        UNIQUE KEY uq_orders_idmp (idempotency_key),
        INDEX idx_orders_user (user_id),
        INDEX idx_orders_status (status),
        INDEX idx_orders_created (created_at),
        INDEX idx_orders_shipaddr (shipping_address_id)
    );

    CREATE TABLE IF NOT EXISTS order_items (
        id INT AUTO_INCREMENT PRIMARY KEY,
        order_id VARCHAR(36) NOT NULL,
        product_id VARCHAR(36) NOT NULL,
        quantity INT NOT NULL,
        price DECIMAL(10, 2) NOT NULL,
        FOREIGN KEY (order_id) REFERENCES orders(id),
        INDEX idx_order_items_order (order_id),
        CONSTRAINT chk_qty_pos CHECK (quantity > 0),
        CONSTRAINT chk_price_nonneg CHECK (price >= 0)
    );
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-orders
spec:
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: mysql-orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-orders
spec:
  selector:
    matchLabels:
      app: mysql-orders
  template:
    metadata:
      labels:
        app: mysql-orders
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        volumeMounts:
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "root"
        - name: MYSQL_DATABASE
          value: "order_db"
        - name: MYSQL_USER
          value: "user"
        - name: MYSQL_PASSWORD
          value: "password"
        ports:
        - containerPort: 3306
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-u", "root", "-proot"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-u", "root", "-proot"]
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
      volumes:
      - name: init-script
        configMap:
          name: mysql-orders-init
