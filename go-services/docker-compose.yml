# Shared by the three MySQL services below, stated once rather than triplicated.
#
# NOTE: compose merges this mapping key-by-key, not recursively. A service that
# declares its own `healthcheck:` replaces THIS BLOCK'S `healthcheck` wholesale,
# so the interval/retries/start_period below vanish silently along with the
# test it overrode. The same trap applies to `command:` and `tmpfs:`.
x-mysql-common: &mysql-common
  # Keep the datadir in RAM.
  #
  # mysql:8.0 declares VOLUME /var/lib/mysql and this file names no volume for
  # it, so before this change every container got a fresh ANONYMOUS volume and
  # every `compose up` paid a full cold `mysqld --initialize`. It is those
  # fsyncs that collapse when several MySQLs initialise at once on a shared CI
  # host -- which is exactly what the kafka-ecommerce lane does: two matrix axes
  # x three services = six concurrent cold inits. Nothing here needs to outlive
  # its container, so the disk round-trips buy nothing.
  #
  # Consequence worth knowing: the datadir now dies with the CONTAINER, not just
  # with the volume, so a stop/start re-initialises and re-runs db.sql. CI is
  # unaffected -- it tears the whole project down between the record and replay
  # phases, so both already started from a virgin DB -- but a local
  # `compose stop && compose start` no longer preserves rows.
  tmpfs:
    - /var/lib/mysql:size=1g
  # Binary logging buys nothing here -- no replication, no point-in-time
  # recovery -- and it roughly halves how fast the datadir grows under writes,
  # which is what keeps the cap above comfortable. It saves almost nothing at
  # rest; the point is the growth rate, not the baseline.
  #
  # Deliberately NOT also shrinking innodb_redo_log_capacity. It would free real
  # RAM per container, but the redo log is preallocated, so on tmpfs it costs no
  # init time to keep -- and capping it low makes InnoDB block writer threads
  # with "MY-014084 ... unable to reserve space in redo log". That trades a new
  # stall mode for RAM nothing here is short of.
  #
  # Know the failure mode at the size= cap above: MySQL does NOT exit on a full
  # datadir. It logs "Disk is full ... waiting for someone to free space",
  # retries every 60s, reprints only every 600s, and the healthcheck keeps
  # reporting healthy throughout -- so a run that hits it hangs to the pipeline
  # timeout with almost nothing pointing at the cause. Keep the cap well above
  # the real footprint rather than trimming it close.
  command: --skip-log-bin
  healthcheck:
    # -h 127.0.0.1 forces a TCP check: during MySQL's init phase the server
    # listens only on the unix socket (skip-networking), so `-h localhost`
    # (socket) reports healthy before the network port is serving -- dependents
    # gated on service_healthy then start early and hit "connection refused".
    # A TCP probe only passes once 3306 is actually accepting connections.
    test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp" ]
    interval: 5s
    timeout: 5s
    retries: 20
    # start_period must cover a FIRST-RUN init end to end, because the probe
    # above cannot pass during any of it: the entrypoint initialises the data
    # directory, starts a socket-only temporary server, seeds db.sql, then stops
    # it -- 3306 is not accepting TCP that whole time. retries/interval are the
    # wrong knob, since they bound failures AFTER a service was once ready and
    # padding them would also slow detection of a MySQL that dies mid-test.
    #
    # Deliberately left at 60s. The cold-init contention that made 60s too tight
    # is what the tmpfs datadir above removes, so raising it as well would mean
    # a green run could no longer tell you which change fixed the lane. It also
    # costs diagnosability: time-to-unhealthy is start_period + retries*interval
    # (160s here), and the CI script waits 240s before giving up -- widening
    # this narrows that margin until the script's generic "failed to start"
    # fires before compose's precise "dependency failed to start: ... is
    # unhealthy". If the lane still flakes, raise it then, with evidence.
    start_period: 60s

services:
  mysql-users:
    image: mysql:8.0
    restart: "no"
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "${MYSQL_USERS_PORT:-3307}:3306"
    volumes:
      - ./user_service/db.sql:/docker-entrypoint-initdb.d/init.sql
    <<: *mysql-common

  mysql-products:
    image: mysql:8.0
    restart: "no"
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: product_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "${MYSQL_PRODUCTS_PORT:-3308}:3306"
    volumes:
      - ./product_service/db.sql:/docker-entrypoint-initdb.d/init.sql
    <<: *mysql-common

  mysql-orders:
    image: mysql:8.0
    restart: "no"
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "${MYSQL_ORDERS_PORT:-3309}:3306"
    volumes:
      - ./order_service/db.sql:/docker-entrypoint-initdb.d/init.sql
    <<: *mysql-common

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: "no"
    stop_grace_period: 20s
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: "no"
    stop_grace_period: 20s
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ '/bin/bash', '-c' ]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic order-events --partitions 3 --replication-factor 1
      echo 'Topics created successfully!'
      kafka-topics --bootstrap-server kafka:9092 --list
      tail -f /dev/null
      "
    restart: "no"
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list" ]
      interval: 5s
      timeout: 10s
      retries: 5

  user_service:
    build:
      context: .
      dockerfile: ./user_service/Dockerfile
    restart: "no"
    stop_grace_period: 20s
    environment:
      DB_HOST: mysql-users
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: user_db
      FLASK_RUN_PORT: "8082"
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin123
      RESET_ADMIN_PASSWORD: "true"
      COVERAGE: "1"
      JWT_TTL_SECONDS: "259200"  # 3 days (72 hours) for Keploy testing
    depends_on:
      mysql-users:
        condition: service_healthy
    ports:
      - "${USER_SERVICE_PORT:-8082}:8082"
    volumes:
      - ./coverage:/coverage
      - ./user_service/coverage:/svc_coverage

  product_service:
    build:
      context: .
      dockerfile: ./product_service/Dockerfile
    restart: "no"
    stop_grace_period: 20s
    environment:
      DB_HOST: mysql-products
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: product_db
      FLASK_RUN_PORT: "8081"
      COVERAGE: "1"
    depends_on:
      mysql-products:
        condition: service_healthy
    ports:
      - "${PRODUCT_SERVICE_PORT:-8081}:8081"
    volumes:
      - ./coverage:/coverage
      - ./product_service/coverage:/svc_coverage

  order_service:
    build:
      context: .
      dockerfile: ./order_service/Dockerfile
    restart: "no"
    stop_grace_period: 20s
    environment:
      DB_HOST: mysql-orders
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: order_db
      USER_SERVICE_URL: http://user_service:8082/api/v1
      PRODUCT_SERVICE_URL: http://product_service:8081/api/v1
      # Kafka configuration
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: order-events
      KAFKA_GROUP_ID: order-service-group
      FLASK_RUN_PORT: "8080"
      COVERAGE: "1"
      GOCOVERDIR: /svc_coverage
    depends_on:
      mysql-orders:
        condition: service_healthy
      user_service:
        condition: service_started
      product_service:
        condition: service_started
      kafka-init:
        condition: service_healthy
    ports:
      - "${ORDER_SERVICE_PORT:-8080}:8080"
    volumes:
      - ./coverage:/coverage
      - ./order_service/coverage:/svc_coverage

  apigateway:
    build:
      context: .
      dockerfile: ./apigateway/Dockerfile
    restart: "no"
    stop_grace_period: 20s
    environment:
      USER_SERVICE_URL: http://user_service:8082/api/v1
      PRODUCT_SERVICE_URL: http://product_service:8081/api/v1
      ORDER_SERVICE_URL: http://order_service:8080/api/v1
      FLASK_RUN_PORT: "8083"
      COVERAGE: "1"
    depends_on:
      user_service:
        condition: service_started
      product_service:
        condition: service_started
      order_service:
        condition: service_started
    ports:
      - "${APIGATEWAY_PORT:-8083}:8083"
    volumes:
      - ./coverage:/coverage
      - ./apigateway/coverage:/svc_coverage
